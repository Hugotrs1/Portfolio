# À chaque push sur master : export statique Next.js puis envoi sur https://portfolio.hugotrs.fr
# La clé DEPLOY_SSH_KEY ne peut que déposer un site (voir /srv/scripts/deploy-receive.sh sur le serveur).
name: Déploiement

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build (export statique)
        run: |
          for name in NEXT_PUBLIC_EMAILJS_PUBLIC_KEY NEXT_PUBLIC_EMAILJS_SERVICE_ID NEXT_PUBLIC_EMAILJS_TEMPLATE_ID; do
            [ -n "${!name}" ] || { echo "::error::Secret GitHub manquant : $name"; exit 1; }
          done
          npm run build
        env:
          NEXT_PUBLIC_EMAILJS_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_EMAILJS_PUBLIC_KEY }}
          NEXT_PUBLIC_EMAILJS_SERVICE_ID: ${{ secrets.NEXT_PUBLIC_EMAILJS_SERVICE_ID }}
          NEXT_PUBLIC_EMAILJS_TEMPLATE_ID: ${{ secrets.NEXT_PUBLIC_EMAILJS_TEMPLATE_ID }}
      - name: Envoi sur portfolio.hugotrs.fr
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          echo "hugotrs.fr ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIF7AzFQ2qszF2tfgkRkDlrHOVfZape64Ilxl40zpxSMb" > ~/.ssh/known_hosts
          tar -czf - -C out . | ssh -i ~/.ssh/deploy hugo@hugotrs.fr "site portfolio"
